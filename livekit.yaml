# Development-only LiveKit configuration. The key pair here is a local
# placeholder and must never be reused outside this machine.
port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false

keys:
  devkey: devsecret_local_only_change_me_32chars

logging:
  level: info
  json: false

room:
  auto_create: false
  max_participants: 4
  empty_timeout: 300
