# Development-only LiveKit configuration. The key pair here is a local
# placeholder and must never be reused outside this machine.
port: 7880

rtc:
  tcp_port: 7881
  # A single muxed UDP port rather than a 100-port range: publishing a wide
  # UDP range through Docker Desktop on Windows is slow to start and
  # unreliable, and this stack targets local development first.
  udp_port: 7882
  use_external_ip: false

keys:
  devkey: devsecret_local_only_change_me_32chars

# The egress container (F07) dispatches recording requests to this server
# through Redis. A database index separate from the application's (db 0).
redis:
  address: redis:6379
  db: 1

logging:
  level: info
  json: false

room:
  auto_create: false
  max_participants: 4
  empty_timeout: 300

# F05 (Live Classroom) is the source of truth for lesson start/end and
# participant presence, driven by these signed callbacks rather than by
# client-reported events — the API must see a closed tab or a crashed
# browser the same way it sees an explicit leave.
webhook:
  api_key: devkey
  urls:
    - http://api:3001/classroom/livekit-webhook
