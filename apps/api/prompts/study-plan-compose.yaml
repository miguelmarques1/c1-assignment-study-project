# study-plan-compose (F15, version 2): an ordered selection over a bank of
# candidate metadata, with a one-sentence rationale each. The model never
# sees a full item body, an answer key, or another participant's data —
# only ids, types, levels, topics, skills, target tags and durations
# (spec §5 "candidates" variable). It proposes; the deterministic
# guardrails in code (composition/model-selection.ts, plan-selection.ts)
# reject unknown or duplicate refs, enforce quotas, add the writing,
# speaking and pronunciation task slots, and recompute every time
# estimate. A missing key, a quota error, or output that is mostly
# invalid all fall back to a plan composed by code alone.
#
# Bump `version` on any change that can alter output. Read only when the
# API boots: restart it after editing this file.

id: study-plan-compose
version: "2"
model: gemini-3.6-flash
temperature: 0.4
max_output_tokens: 2000
system: |
  You choose which items from an existing content bank belong in one
  learner's next study plan. You never invent an item or see its body —
  only the metadata you are given. You prioritise what is due for review,
  then the learner's recurring weaknesses, and you explain each choice in
  one plain sentence naming the weakness by name, never by quoting the
  learner or by claiming a score.
user_template: |
  This learner's profile:
  {{profile_summary}}

  Weaknesses to target, ranked (most important first):
  {{focus_tags}}

  Tags due for review right now:
  {{review_tags}}

  Candidate items (id | type | level | topic | skills | target tags | estimated minutes | note):
  {{candidates}}

  Select {{selection_range}} candidates, each at most once, in priority
  order. Put a due review tag's candidates first, then recurring
  weaknesses. Keep review-tagged candidates at or below 30% of your
  selection. Include at least one listening and one reading candidate
  when the list above offers one. Do not select anything for writing,
  speaking or pronunciation — the app adds those itself.

  For each selection, write one plain sentence explaining why: name the
  weakness by its label, never quote the learner's own words, never
  state a score, and never promise an outcome.
variables:
  - name: profile_summary
    required: true
  - name: focus_tags
    required: true
  - name: review_tags
    required: true
  - name: candidates
    required: true
  - name: selection_range
    required: true
response_schema:
  type: object
  properties:
    selections:
      type: array
      minItems: 1
      maxItems: 24
      items:
        type: object
        properties:
          ref:
            type: string
            minLength: 1
          rationale:
            type: string
            minLength: 1
        required: [ref, rationale]
  required: [selections]
examples:
  - user: |
      This learner's profile:
      Grammar 58 (3 measurements, flat). Vocabulary 64 (5 measurements, up). Fluency 70 (4 measurements, flat).
      Interaction 66 (3 measurements, flat). Comprehension 72 (6 measurements, up). Pronunciation 60 (4 measurements, down).

      Weaknesses to target, ranked (most important first):
      - grammar:conditional-3 (Third conditional): recurring, seen in 4 of the last 5 lessons
      - vocab:phrasal-verb (Phrasal verb): recurring, seen in 2 of the last 5 lessons
      - discourse:hedging (Hedging): unmastered

      Tags due for review right now:
      None due.

      Candidate items (id | type | level | topic | skills | target tags | estimated minutes | note):
      c01 | reading | C1 | urban housing | reading, grammar | grammar:conditional-3, discourse:hedging | 7 min | new for this plan
      c02 | listening | C1 | workplace negotiation | listening | vocab:phrasal-verb | 9 min |
      c03 | grammar | C1 | — | grammar | grammar:conditional-3 | 6 min | new for this plan
      c04 | vocabulary | C1 | — | vocabulary | vocab:phrasal-verb | 6 min |
      c05 | error_review | C1 | — | reading | discourse:hedging | 6 min | new for this plan

      Select between 3 and 5 candidates, each at most once, in priority
      order. Put a due review tag's candidates first, then recurring
      weaknesses. Keep review-tagged candidates at or below 30% of your
      selection. Include at least one listening and one reading candidate
      when the list above offers one. Do not select anything for writing,
      speaking or pronunciation — the app adds those itself.

      For each selection, write one plain sentence explaining why: name the
      weakness by its label, never quote the learner's own words, never
      state a score, and never promise an outcome.
    output:
      selections:
        - ref: c01
          rationale: Third conditional keeps recurring, and this reading puts it alongside hedging language in one natural text.
        - ref: c02
          rationale: Phrasal verbs are a steady weak spot, and this listening item is built around exactly that pattern.
        - ref: c03
          rationale: A short grammar drill gives the third conditional focused, low-pressure repetition.
        - ref: c05
          rationale: Hedging has not been mastered yet, so a review item keeps it in front of the learner.
constraints:
  - Select only from the candidates given, each at most once — never invent an id.
  - Never select a candidate for writing, speaking or pronunciation.
  - A rationale is one plain sentence, names the weakness by label, and never quotes the learner, states a score, or promises an outcome.
banned_phrases: []
