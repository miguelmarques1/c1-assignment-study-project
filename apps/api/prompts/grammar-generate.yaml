# grammar-generate (F14, version 2): passages that use one grammar structure the learner gets wrong.
#
# Difficulty is asked for as measurable constraints, never as "C1": every
# number below arrives as a variable rendered from rules/content-generation.yaml,
# and the difficulty gate measures the answer against the same file in code
# (word count, sentence length, type-token ratio, share of words outside the
# 3,000 most frequent, target-structure occurrences, banned phrases, questions
# and their evidence). A failing item is regenerated once with the failed
# checks appended after this message.
#
# The three examples are style exemplars: short, authentic, public-domain
# passages by G. K. Chesterton, from "All Things Considered" (1908), via
# Project Gutenberg (ebook #11505): "The Fallacy of Success", "The Error of
# Impartiality" and "On Running After One's Hat". They show register, not
# content, length or structure. F14 renders one of them per generation, in
# rotation (execute's exampleIndexes).
#
# Bump `version` on any change that can alter output. Read only when the API
# boots: restart it after editing this file.

id: grammar-generate
version: "2"
model: gemini-3.6-flash
temperature: 0.8
max_output_tokens: 4500
system: |
  You write short texts for adults preparing for the C1 English exam that use one grammar
  structure naturally and repeatedly, followed by five questions. The text must read like
  authentic published prose in which the structure occurs because the content needs it, never
  like a drill. Every number you are given is measured in code after you answer, and a text
  that misses one is rejected.
user_template: |
  Subject area to find a concrete situation in: {{topic_domain}}

  Target structure. The learner gets this wrong; use it correctly and naturally:
  {{target_structures}}

  Write one text that:
  - is {{word_range}} words long, in paragraphs separated by a blank line;
  - averages {{sentence_length_range}} words per sentence;
  - keeps a type-token ratio of at least {{min_type_token_ratio}};
  - uses less common vocabulary, so that at least {{min_out_of_frequency_percent}}% of its words fall outside the 3,000 most frequent English words;
  - uses the target structure at least {{min_occurrences}} times, spread across the beginning, the middle and the end;
  - makes a point or tells a situation with concrete specifics, in a formal or semi-formal register.

  At least 2 of the 5 questions must test the target structure directly; prefer fill_blank for these, with the blank where the structure's form is decided.

  Then write exactly 5 questions about the text. Use only the formats "multiple_choice" and "fill_blank".
  - multiple_choice: exactly 4 distinct options with exactly one correct; "answer" repeats the correct option's text exactly.
  - fill_blank: "prompt" contains exactly one blank written as ___ and "accepted_answers" lists the correct form (1 to 5 accepted forms, no duplicates).
  - Every question has an "explanation" of one or two sentences saying why the answer is right.
  - Every question has an "evidence": 4 to 60 words copied exactly from the text that prove the answer. For fill_blank the evidence contains the answer.

  Finally, in "target_occurrences", list every use of each target structure: the tag exactly as written above, and the words copied exactly from the text (2 to 40 words, the whole phrase that shows the structure).
variables:
  - name: topic_domain
    required: true
  - name: target_structures
    required: true
  - name: word_range
    required: true
  - name: sentence_length_range
    required: true
  - name: min_type_token_ratio
    required: true
  - name: min_out_of_frequency_percent
    required: true
  - name: min_occurrences
    required: true
response_schema:
  type: object
  properties:
    title:
      type: string
    topic:
      type: string
    body:
      type: string
    questions:
      type: array
      minItems: 5
      maxItems: 5
      items:
        type: object
        properties:
          format:
            type: string
            enum: [multiple_choice, fill_blank]
          prompt:
            type: string
          options:
            type: array
            minItems: 4
            maxItems: 4
            items:
              type: string
          answer:
            type: string
          accepted_answers:
            type: array
            minItems: 1
            maxItems: 5
            items:
              type: string
          explanation:
            type: string
          evidence:
            type: string
        required: [format, prompt, explanation, evidence]
    target_occurrences:
      type: array
      items:
        type: object
        properties:
          tag:
            type: string
          quote:
            type: string
        required: [tag, quote]
  required: [title, topic, body, questions, target_occurrences]
examples:
  - user: "Style exemplar (register only: the real request has its own subject, length and target structure). Target structure: grammar:passive-voice."
    output:
      title: "The Fallacy of Success"
      topic: "self-help literature"
      body: >-
        There has appeared in our time a particular class of books and articles which I sincerely and
        solemnly think may be called the silliest ever known among men. They are much more wild than the
        wildest romances of chivalry and much more dull than the dullest religious tract. Moreover, the
        romances of chivalry were at least about chivalry; the religious tracts are about religion. But
        these things are about nothing; they are about what is called Success. On every bookstall, in
        every magazine, you may find works telling people how to succeed. They are books showing men how
        to succeed in everything; they are written by men who cannot even succeed in writing books. To
        begin with, of course, there is no such thing as Success.
      questions:
          - format: fill_blank
            prompt: "These books, the author says, ___ written by men who cannot succeed in writing books."
            accepted_answers: ["are"]
            explanation: "A present passive: \"are\" + past participle."
            evidence: "they are written by men who cannot even succeed in writing books"
          - format: multiple_choice
            prompt: "Which phrase from the passage is in the passive voice?"
            options: ["may be called the silliest", "you may find works", "They are books showing men", "there is no such thing"]
            answer: "may be called the silliest"
            explanation: "Modal + \"be\" + past participle is a passive."
            evidence: "which I sincerely and solemnly think may be called the silliest ever known among men"
          - format: fill_blank
            prompt: "They are about what ___ called Success."
            accepted_answers: ["is"]
            explanation: "The passive \"is called\" names something without saying who names it."
            evidence: "they are about what is called Success"
          - format: multiple_choice
            prompt: "Why does the author use the passive in \"they are written by men who cannot even succeed in writing books\"?"
            options: ["To keep the books as the subject and reveal the writers at the end", "To hide who wrote the books", "To describe a future event", "To give an order"]
            answer: "To keep the books as the subject and reveal the writers at the end"
            explanation: "The agent comes last, where the irony lands."
            evidence: "they are written by men who cannot even succeed in writing books"
          - format: multiple_choice
            prompt: "According to the author, how do these books compare with religious tracts?"
            options: ["They are duller", "They are more useful", "They are shorter", "They are more honest"]
            answer: "They are duller"
            explanation: "He calls them duller than the dullest tract."
            evidence: "much more dull than the dullest religious tract"
      target_occurrences:
          - { tag: "grammar:passive-voice", quote: "may be called the silliest ever known among men" }
          - { tag: "grammar:passive-voice", quote: "what is called Success" }
          - { tag: "grammar:passive-voice", quote: "they are written by men who cannot even succeed in writing books" }
  - user: "Style exemplar (register only: the real request has its own subject, length and target structure). Target structure: grammar:passive-voice."
    output:
      title: "The Error of Impartiality"
      topic: "juries and impartiality"
      body: >-
        What people call impartiality may simply mean indifference, and what people call partiality may
        simply mean mental activity. It is sometimes made an objection, for instance, to a juror that he
        has formed some primâ-facie opinion upon a case: if he can be forced under sharp questioning to
        admit that he has formed such an opinion, he is regarded as manifestly unfit to conduct the
        inquiry. Surely this is unsound. If his bias is one of interest, of class, or creed, or
        notorious propaganda, then that fact certainly proves that he is not an impartial arbiter. But
        the mere fact that he did form some temporary impression from the first facts as far as he knew
        them—this does not prove that he is not an impartial arbiter—it only proves that he is not a
        cold-blooded fool.
      questions:
          - format: fill_blank
            prompt: "If a juror can ___ forced to admit an opinion, he is regarded as unfit."
            accepted_answers: ["be"]
            explanation: "After a modal, the passive is \"be\" + past participle."
            evidence: "if he can be forced under sharp questioning to admit"
          - format: multiple_choice
            prompt: "Which phrase from the passage uses the passive voice?"
            options: ["he is regarded as manifestly unfit", "he has formed such an opinion", "this is unsound", "he did form some temporary impression"]
            answer: "he is regarded as manifestly unfit"
            explanation: "\"is regarded\" is \"be\" + past participle."
            evidence: "he is regarded as manifestly unfit to conduct the inquiry"
          - format: fill_blank
            prompt: "It is sometimes ___ an objection to a juror that he has formed an opinion."
            accepted_answers: ["made"]
            explanation: "The passive of \"make an objection\" is \"an objection is made\"."
            evidence: "It is sometimes made an objection, for instance, to a juror"
          - format: multiple_choice
            prompt: "What does the author think of rejecting jurors for having first impressions?"
            options: ["It is unsound", "It is essential", "It is fair to both sides", "It is required by law"]
            answer: "It is unsound"
            explanation: "He says so directly."
            evidence: "Surely this is unsound"
          - format: multiple_choice
            prompt: "In \"he is regarded as manifestly unfit\", who does the regarding?"
            options: ["The text leaves it unstated", "The juror himself", "The accused", "The author"]
            answer: "The text leaves it unstated"
            explanation: "A passive without \"by\" leaves the agent out."
            evidence: "he is regarded as manifestly unfit to conduct the inquiry"
      target_occurrences:
          - { tag: "grammar:passive-voice", quote: "It is sometimes made an objection" }
          - { tag: "grammar:passive-voice", quote: "if he can be forced under sharp questioning" }
          - { tag: "grammar:passive-voice", quote: "he is regarded as manifestly unfit to conduct the inquiry" }
  - user: "Style exemplar (register only: the real request has its own subject, length and target structure). Target structure: grammar:comparison."
    output:
      title: "On Running After One's Hat"
      topic: "everyday inconveniences"
      body: >-
        Some consider such romantic views of flood or fire slightly lacking in reality. But really this
        romantic view of such inconveniences is quite as practical as the other. The true optimist who
        sees in such things an opportunity for enjoyment is quite as logical and much more sensible than
        the ordinary “Indignant Ratepayer” who sees in them an opportunity for grumbling. Real pain, as
        in the case of being burnt at Smithfield or having a toothache, is a positive thing; it can be
        supported, but scarcely enjoyed. But, after all, our toothaches are the exception, and as for
        being burnt at Smithfield, it only happens to us at the very longest intervals. And most of the
        inconveniences that make men swear or women cry are really sentimental or imaginative
        inconveniences—things altogether of the mind.
      questions:
          - format: fill_blank
            prompt: "The romantic view is quite ___ practical as the other."
            accepted_answers: ["as"]
            explanation: "An equal comparison is \"as\" + adjective + \"as\"."
            evidence: "this romantic view of such inconveniences is quite as practical as the other"
          - format: multiple_choice
            prompt: "Which phrase makes a comparison of superiority?"
            options: ["much more sensible than", "quite as logical", "a positive thing", "the very longest intervals"]
            answer: "much more sensible than"
            explanation: "\"more\" + adjective + \"than\" compares upwards."
            evidence: "much more sensible than the ordinary “Indignant Ratepayer”"
          - format: fill_blank
            prompt: "Being burnt at Smithfield happens at the very ___ intervals."
            accepted_answers: ["longest"]
            explanation: "A superlative follows \"the very\"."
            evidence: "it only happens to us at the very longest intervals"
          - format: multiple_choice
            prompt: "The true optimist is described as:"
            options: ["As logical as the grumbler and more sensible", "Less logical than the grumbler", "As foolish as the grumbler", "The least sensible person"]
            answer: "As logical as the grumbler and more sensible"
            explanation: "The sentence combines an equal and a superior comparison."
            evidence: "quite as logical and much more sensible than the ordinary"
          - format: fill_blank
            prompt: "Real pain can be supported, but ___ enjoyed."
            accepted_answers: ["scarcely", "hardly"]
            explanation: "\"Scarcely\" and \"hardly\" both mean almost not."
            evidence: "it can be supported, but scarcely enjoyed"
      target_occurrences:
          - { tag: "grammar:comparison", quote: "quite as practical as the other" }
          - { tag: "grammar:comparison", quote: "much more sensible than the ordinary" }
          - { tag: "grammar:comparison", quote: "at the very longest intervals" }
constraints:
  - "Never write a listicle or a catalogue of points (numbered items, \"Firstly... Secondly...\" sequences), headings or bullet points in the body."
  - "Never write a dialogue-only script or audio cues; this is a text to read."
  - "Never mention that the text is for learners, and never name or explain the target structures inside the text."
  - "Copy nothing from the style exemplars (not their topic, sentences or wording); they only show register."
  - "Quote evidence and target occurrences exactly as they appear in the text, with the same words in the same order."
banned_phrases: ["grammar point", "this structure"]
