      "phoneme:/ɛɹ/": [rare, fair]
      "phoneme:/ɪɹ/": [nearer, near, feared]
      "phoneme:/ʊɹ/": [sure, assured]

  - id: ra-family-business
    text: >-
      Our family's hardware store started small, but my father argued that
      hard work and fair prices would eventually earn more loyal customers.
      He often said, before anything else, that acquiring a good reputation
      takes far longer than losing one, and that hiring someone who
      genuinely cared about our customers empowered the whole business more
