      "phoneme:/ɝ/": [certain, universe]
      "phoneme:/aɪ/": [night, quietly, tired, sky]
      "phoneme:/aʊ/": [how, proud]
      "phoneme:/ju/": [universe, using]

  - id: ra-shipwreck
    text: >-
      Sailors aboard the ship had every reason to worry as the storm grew
      nearer. Some feared the rare disaster was no longer avoidable, and the
      noise of the waves added to their choice to abandon ship. Still, others
      felt sure and assured that fair courage would guide them safely near
      the shore before the weather turned dangerous.
    drills:
