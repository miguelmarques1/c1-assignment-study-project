      "phoneme:/f/": [after, forty, faithful, far]
      "phoneme:/v/": [ever, achievements, vision]
      "phoneme:/z/": [years, praising]
      "phoneme:/ə/": [colleagues, achievements, influence, beside]

open_response:
  - id: or-office-return
    prompt: >-
      Your company wants everyone back in the office five days a week. What
      would you say to your manager, and how would you make your case without
      sounding confrontational?
    hint: Hedge your claims and give one concrete example.
    targets: ["discourse:hedging", "discourse:politeness"]

  - id: or-neighbor-noise
    prompt: >-
      Your upstairs neighbor keeps you awake most nights with loud music.
      Describe how you would knock on their door and raise the problem
      without starting an argument you might regret later.
    hint: Ask a clarifying question before you make any accusation.
    targets: ["discourse:politeness", "discourse:clarification"]

  - id: or-project-delay
    prompt: >-
      A project you are responsible for will now finish two weeks later than
      promised. Explain the delay to the client in a way that connects the
      causes clearly and still sounds confident about the plan going forward.
    hint: Use clear linking words between each reason you give.
    targets: ["discourse:connector", "discourse:cohesion"]

  - id: or-interrupting-meeting
    prompt: >-
      During a busy team meeting, you notice one colleague never gets the
      chance to speak because others keep interrupting. Describe how you
      would step in, give that person space to talk, and keep the discussion
      fair.
    hint: Signal clearly before you take a turn or offer one to someone else.
    targets: ["discourse:turn-taking", "discourse:politeness"]

  - id: or-return-gift
    prompt: >-
      A close friend gives you a gift you do not like at all. Describe what
      you would say and do in the moment, choosing your words so the gift
      feels appreciated without any dishonesty.
    hint: Pick natural word pairings, not awkward literal translations.
    targets: ["vocab:collocation", "vocab:register"]

  - id: or-give-up-habit
    prompt: >-
      Think of a habit you eventually gave up, whether a small one or a
      serious one. Explain what made you quit, how difficult the first weeks
      were, and what finally helped it stick.
    hint: Notice how many phrasal verbs naturally describe quitting a habit.
    targets: ["vocab:phrasal-verb"]

  - id: or-idiom-explain
    prompt: >-
      Choose an idiom from your own language that has no direct English
      equivalent. Explain its literal meaning, its real meaning, and describe
      a situation where a native English speaker might use a similar
      expression instead.
    hint: Compare the image behind the idiom, not just its dictionary meaning.
    targets: ["vocab:idiom"]

  - id: or-word-choice-apology
    prompt: >-
      Describe a time you apologized for something and, looking back, chose
      the wrong words for the situation. Explain what you said, what you
      should have said instead, and why the difference mattered.
    hint: Contrast at least two words that seem similar but are not interchangeable.
    targets: ["vocab:word-choice"]

  - id: or-noun-verb-mixup
    prompt: >-
      Explain a piece of advice you would give a beginner English learner who
      often confuses a noun and its related verb, such as advice and advise.
      Use your own example throughout the explanation.
    hint: Keep the same root word but shift its part of speech.
    targets: ["vocab:word-form"]

  - id: or-false-friend-story
    prompt: >-
      Describe a moment when a word that looked familiar from your own
      language completely misled you in English. Explain what you assumed it
      meant, what it actually meant, and how you eventually noticed the
      mistake.
    hint: Focus on the surprise of discovering the real meaning.
    targets: ["vocab:false-friend"]

  - id: or-formal-email
    prompt: >-
      You need to ask your professor for an extension on an assignment.
      Describe exactly what you would say, keeping the tone formal and
      respectful throughout, without becoming either too casual or overly
      dramatic.
    hint: Match your vocabulary to a formal, respectful situation.
    targets: ["vocab:register", "discourse:politeness"]

  - id: or-industry-jargon
    prompt: >-
      Pick a subject you know well, whether from your job, your studies, or a
      hobby, and explain one process from it as if teaching a complete
      beginner, defining any technical term the moment you first use it.
    hint: Define each specialised term the first time you say it.
    targets: ["vocab:domain-term"]

  - id: or-disagree-boss
    prompt: >-
      Your manager proposes an idea you think is a mistake. Explain how you
      would raise your concerns in the next meeting without sounding
      disrespectful or shutting the conversation down completely.
    hint: Soften your disagreement before stating your actual concern.
    targets: ["discourse:hedging", "discourse:politeness"]

  - id: or-recommend-restaurant
    prompt: >-
      A visiting colleague asks you to recommend a restaurant in your city and
      explain what makes it worth the trip. Connect your reasons clearly,
      from the food itself to the atmosphere and the service.
    hint: Link each new reason back to the one before it.
    targets: ["discourse:connector", "vocab:collocation"]

  - id: or-lost-luggage
    prompt: >-
      Your luggage has not arrived after a long flight, and you must explain
      the situation to an airline representative who keeps misunderstanding
      the details. Describe how you would clarify calmly and keep the
      conversation moving.
    hint: Restate the key fact whenever you sense confusion.
    targets: ["discourse:clarification"]

  - id: or-team-credit
    prompt: >-
      A colleague takes full credit for a project that was actually a team
      effort. Describe how you would address this directly with them,
      staying professional while still making your point clearly.
    hint: State the fact gently before naming the problem directly.
    targets: ["discourse:politeness", "discourse:hedging"]

  - id: or-childhood-change
    prompt: >-
      Describe how your neighborhood has changed since your childhood.
      Organize your answer so each change connects naturally to the next,
      from the streets themselves to the people who live there now.
    hint: Let each sentence pick up a thread from the one before it.
    targets: ["discourse:cohesion", "vocab:word-form"]

  - id: or-phrasal-travel
    prompt: >-
      Describe your worst travel experience, from setting off to finally
      getting back home. Use natural expressions for the small disasters
      along the way, not just simple verbs.
    hint: Reach for a phrasal verb before a single formal word.
    targets: ["vocab:phrasal-verb", "vocab:idiom"]

  - id: or-cultural-misunderstanding
    prompt: >-
      Describe a misunderstanding you witnessed or experienced because of a
      word borrowed between two languages that does not mean the same thing
      in both. Explain how the confusion was eventually resolved.
    hint: Name the word and both of its meanings clearly.
    targets: ["vocab:false-friend"]

  - id: or-difficult-feedback
    prompt: >-
      You must give a friend honest feedback about a decision you think is
      unwise. Describe how you would raise your doubts while checking that
      you actually understand their reasons first.
    hint: Ask what you might be missing before you give your opinion.
    targets: ["discourse:hedging", "discourse:clarification"]

  - id: or-negotiating-price
    prompt: >-
      You are negotiating the price of an item at a market where haggling is
      expected. Describe the exchange from your opening offer to the final
      agreed price, keeping the tone friendly rather than aggressive.
    hint: Choose phrases that sound natural in an informal negotiation.
    targets: ["vocab:register", "vocab:collocation"]

  - id: or-technical-support
    prompt: >-
      Explain to a relative with little technical knowledge why their
      internet connection keeps failing and what they should try first.
      Define any technical term before relying on it again.
    hint: Check that your explanation actually landed before moving on.
    targets: ["vocab:domain-term", "discourse:clarification"]
