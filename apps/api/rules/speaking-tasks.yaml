  - id: ra-family-gathering
    text: >-
      Whenever the whole family gathers together, my mother insists on
      cooking something from her mother's old recipes, though nobody quite
      remembers the exact method anymore. Each dish carries a familiar
      taste, and even the youngest children seem to sense that these small
