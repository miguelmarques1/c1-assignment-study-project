      "phoneme:/m/": [my, mother, remembers, matter]
      "phoneme:/n/": [nobody, remembers, anymore, sense]

  - id: ra-long-walk-home
    text: >-
      Walking home along the river, feeling the evening light slowly fading,
      we let ourselves talk freely about nothing serious, laughing
      occasionally at old memories. The road felt longer than usual, yet
      neither of us really wanted the walk to end, willing to let the quiet
