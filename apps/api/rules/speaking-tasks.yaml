  - id: ra-negotiation
    text: >-
      Before the negotiation began, both parties prepared a brief position
      paper, hoping to persuade the other side without appearing stubborn.
      She pushed for a bigger budget, but her opposite number pushed back
      with genuine arguments, gradually building a compromise that gave both
      sides something valuable to bring home.
