# Speaking tasks (F18). Read only when the API boots; an invalid file stops it.
# Every task stores the version and fingerprint it was chosen under. Bump the
# version with any change. Passages: 25-60 words, letters and basic
# punctuation only - no digits, hyphenated compounds or abbreviations. Every
# non-retired phoneme tag must be drilled by at least 2 passages; every
# non-retired discourse and vocab tag must be targeted by at least 1 prompt.
version: "1"

read_aloud:
  - id: ra-valley-bridges
    text: >-
      Nothing in the southern valley was thought through. Three weathered
      bridges gathered the traffic of the whole district, and although everyone
      knew the thin wooden beams would one day give way, nobody thought the
      repairs worth the trouble until the morning the northern bridge finally
      collapsed.
    drills:
      "phoneme:/θ/": [nothing, thought, three, thin]
      "phoneme:/ð/": [the, weathered, gathered, although]

  - id: ra-pilot-project
    text: >-
      The pilot project began badly. Every deadline was missed, and the budget
      kept climbing until nobody could explain where the extra spending had
      actually gone. Still, the team refused to abandon the idea, believing
      that a better plan, built carefully and tested twice, could still
      deliver what the client actually wanted.
    drills:
      "phoneme:/p/": [pilot, project, spending, plan, deliver]
      "phoneme:/b/": [badly, budget, better, built, believing]
      "phoneme:/t/": [team, tested, still, until, twice]
      "phoneme:/d/": [deadline, deliver, abandon]
      "phoneme:/k/": [climbing, could, client, kept, actually]

  - id: ra-garden-fence
    text: >-
      Ever since the fence fell, the garden had felt forgotten. Grass grew
      freely over the vegetable beds, and the fig tree gave more fruit than
      anyone could gather. Still, she refused to sell the house, insisting
      that a garden left to itself sometimes finds its own strange, generous
      shape.
    drills:
      "phoneme:/g/": [garden, grew, gave, gather]
      "phoneme:/f/": [fence, fell, felt, forgotten, fig, fruit]
      "phoneme:/v/": [vegetable, ever, over]
      "phoneme:/s/": [since, grass, sell, insisting, sometimes, shape]

  - id: ra-museum-tour
    text: >-
      Museums usually seem quiet, but this one buzzed with visitors as soon as
      the doors opened. She wished she had chosen a shorter visit, since every
      room revealed a new treasure, and the decision to skip the pleasure of
      the sculpture hall began to feel like an honest mistake.
    drills:
      "phoneme:/z/": [museums, buzzed, visitors, doors]
      "phoneme:/ʒ/": [usually, decision, pleasure]
      "phoneme:/ʃ/": [she, wished, shorter]
      "phoneme:/h/": [had, hall]

  - id: ra-grandfather-watch
    text: >-
      My grandfather kept a small watch in the kitchen drawer, and every time
      the family gathered, someone would ask to touch it again. It had
      survived a journey across many countries, damaged but never truly
      broken, and my mother insisted it remembered more about our name than
      any photograph could manage.
    drills:
      "phoneme:/tʃ/": [watch, kitchen, touch]
      "phoneme:/dʒ/": [journey, damaged, manage]
      "phoneme:/m/": [my, family, mother, name]
      "phoneme:/n/": [kitchen, never, insisted, any]

  - id: ra-mountain-path
    text: >-
      Walking along the ridge, we kept talking about nothing important, just
      watching the clouds rolling slowly toward the valley below. The wind was
      growing stronger, and every rock along the trail looked wet from the
      morning rain, yet nobody wanted to turn around while the light was still
      working in our favour.
    drills:
      "phoneme:/ŋ/": [walking, talking, nothing, growing]
      "phoneme:/l/": [along, clouds, slowly, valley]
      "phoneme:/ɹ/": [ridge, rock, trail, morning]
      "phoneme:/w/": [walking, we, wind, wanted]

  - id: ra-job-interview
    text: >-
      Before the interview, you should rehearse your opinions about the
      company's values, not just memorise a few useful phrases. A confident
      young candidate usually argues with genuine curiosity rather than
      familiar excuses, and that small difference, more than any perfect
      answer, tends to convince a skeptical committee.
    drills:
      "phoneme:/j/": [opinions, young, usually, curiosity]
      "phoneme:/t/": [interview, tends, skeptical, about]
      "phoneme:/d/": [should, candidate, difference]

  - id: ra-power-persuasion
    text: >-
      Power rarely persuades by force alone. A brave leader often builds trust
      before demanding obedience, offering fair reasons instead of empty
      threats. When people feel respected, they follow willingly; when they
      feel forced, they obey only until the pressure lifts, and then the whole
      effort quietly falls apart.
    drills:
      "phoneme:/p/": [power, persuades, people, pressure]
      "phoneme:/b/": [brave, builds, before, obey]
      "phoneme:/f/": [force, fair, follow, falls]

  - id: ra-coastal-village
    text: >-
      Every evening, the village grew silent as the waves settled against the
      shore. Visitors rarely stayed past sunset, but a few families remained,
      watching the same view for years, convinced that nowhere else offered
      such a peaceful vision of ordinary life continuing quietly beside the
      sea.
    drills:
      "phoneme:/v/": [every, evening, visitors, view]
      "phoneme:/s/": [silent, settled, sunset, stayed]
      "phoneme:/z/": [waves, families, years]

  - id: ra-committee-debate
    text: >-
      She insisted the decision was rushed, and her sharp objections pushed
      the whole committee toward a difficult judgement. He argued that
      patience mattered more than pleasure, that a hasty conclusion damaged
      trust, and that history usually punished those who chased an easy
      answer instead of a hard one.
    drills:
      "phoneme:/ʃ/": [she, rushed, sharp, pushed]
      "phoneme:/ʒ/": [decision, pleasure, usually]
      "phoneme:/h/": [her, he, history, hard]
      "phoneme:/dʒ/": [judgement, damaged]

  - id: ra-long-flight
    text: >-
      After three sleepless hours, she began to see the city lights beneath
      the wing, believing the journey was nearly finished. Every seat around
      her stayed silent, and even the crew seemed relieved, though she still
      felt a strange mixture of relief and regret as the plane began its slow
      descent.
    drills:
      "phoneme:/i/": [see, seat, relieved, relief]
      "phoneme:/ɪ/": [city, finished, still, mixture]
      "phoneme:/eɪ/": [stayed, plane]
      "phoneme:/ɛ/": [every, regret, felt]

  - id: ra-buying-house
    text: >-
      Actually, the family had planned to buy a small house near the harbor,
      hoping the calm neighborhood would suit their growing household. They
      already knew the process could involve unexpected costs, but they also
      hoped the whole move would open a hopeful chapter, not another
      exhausting chore.
    drills:
      "phoneme:/æ/": [actually, family, had, planned]
      "phoneme:/ɑ/": [costs, not]
      "phoneme:/ɔ/": [small, already]
      "phoneme:/oʊ/": [hoping, hoped, hopeful, open]

  - id: ra-learning-cook
    text: >-
      Cooking well takes patience, not luck. You should follow a truly good
      recipe before trying to improvise, because a single rushed step can
      ruin the whole dish. My mother always insisted that anyone could learn
      to cook something delicious, provided they were willing to stay in the
      kitchen a little longer than felt comfortable.
    drills:
      "phoneme:/ʊ/": [cooking, should, good, could]
      "phoneme:/u/": [you, ruin, truly]
      "phoneme:/ʌ/": [luck, something, comfortable, mother]
      "phoneme:/ə/": [patience, recipe, provided, single]

  - id: ra-night-sky
    text: >-
      Under a clearer sky than usual, we found ourselves counting the
      brightest stars while the mountain wind grew louder around the camp. My
      brother insisted the universe was far stranger than anyone could
      imagine; we were content just to wonder in silence.
    drills:
      "phoneme:/ɚ/": [under, brother, wonder, stranger]
      "phoneme:/ɝ/": [universe, were]
      "phoneme:/aɪ/": [sky, brightest, while, silence]
      "phoneme:/aʊ/": [found, ourselves, around, louder]

  - id: ra-difficult-choice
    text: >-
      Choosing between the two job offers was a difficult choice, and every
      option seemed to involve some unavoidable risk. If she stayed here,
      near her family, she would enjoy comfort but sacrifice ambition; if she
      moved abroad, she could pursue a rare opportunity, though nothing there
      felt fully secure, and no one could feel entirely sure.
    drills:
      "phoneme:/ɔɪ/": [enjoy, choice]
      "phoneme:/ɛɹ/": [there, rare]
      "phoneme:/ɪɹ/": [near, here]
      "phoneme:/ʊɹ/": [secure, sure]

  - id: ra-crossing-border
    text: >-
      Every year, thousands of workers travel far from home in search of a
      better market for their skills. Before they depart, they must prepare
      careful documents, argue their case at a crowded office, and require
      hours of tiring, careful waiting, hoping that hard work alone will
      eventually earn our families a fairer, more secure future.
    drills:
      "phoneme:/ɑɹ/": [far, market, argue, hard]
      "phoneme:/ɔɹ/": [before, more, for]
      "phoneme:/aɪɹ/": [require, tiring]
      "phoneme:/aʊɹ/": [hours, our]

  - id: ra-recipe-fails
    text: >-
      He tried to repeat the same recipe exactly, believing each measured
      detail mattered, yet the result never tasted the way he remembered.
      Every extra minute in the oven left the bread heavier, and no amount of
      careful timing seemed able to explain why the effort kept ending in the
      same tedious mistake.
    drills:
      "phoneme:/i/": [repeat, believing, each]
      "phoneme:/ɪ/": [minute, timing, mistake]
      "phoneme:/eɪ/": [same, way, explain]
      "phoneme:/ɛ/": [every, extra, heavier, left]

  - id: ra-harvest-season
    text: >-
      As autumn approached, the farmers gathered a final harvest before the
      frost arrived, hoping the crop would offset a difficult season. Nothing
      about the process was automatic; every task demanded a practical plan,
      calm patience, and a hopeful attitude, though not everyone involved
      shared that same optimistic outlook.
    drills:
      "phoneme:/æ/": [as, gathered, practical, plan]
      "phoneme:/ɑ/": [not, calm]
      "phoneme:/ɔ/": [autumn, automatic, offset]
      "phoneme:/oʊ/": [approached, hoping, hopeful, outlook]

  - id: ra-night-shift
    text: >-
      Working the night shift took some getting used to. You lose track of
      ordinary routine, and the world outside seems to move at a duller pace
      while everyone else sleeps. Still, I grew to enjoy the quiet, the
      useful solitude, and a strange sense of pursuing something that nobody
      else could truly understand.
