      "phoneme:/n/": [never, narrow, listen, no]

  - id: ra-school-reunion
    text: >-
      Seeing old classmates again felt strange at first, since everyone
      looked different, yet somehow familiar. Old rivalries seemed silly
      now, and small talk quickly gave way to genuine stories about
      children, careers, and the slow, gradual changes life had quietly
      delivered to each of them over the years.
