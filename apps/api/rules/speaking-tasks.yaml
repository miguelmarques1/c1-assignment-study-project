      "phoneme:/ʊ/": [took, could]
      "phoneme:/u/": [used, you, move, truly]
      "phoneme:/ʌ/": [some, duller, understand]
      "phoneme:/ə/": [ordinary, routine, pursuing, solitude]

  - id: ra-telescope
    text: >-
      My father bought an old telescope years ago, and every clear night he
      would carefully observe the stars, quietly certain that the universe
      deserved more patience than curiosity alone. I remember how proud he
      seemed, how he never tired of finding a brighter light in an otherwise
      silent sky, content simply using it for hours.
