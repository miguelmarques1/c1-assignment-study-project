      "phoneme:/ʒ/": [visual, vision, decision]
      "phoneme:/dʒ/": [genuine, judged]
      "phoneme:/v/": [visual, visitor, vision]

  - id: ra-mountain-rescue
    text: >-
      Every rescue mission demands calm nerves and honest communication
      among the whole team. When a hiker goes missing near a remote ridge,
      hours can matter more than anything else, and no member of the crew is
