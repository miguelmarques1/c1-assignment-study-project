  - id: ra-retirement-speech
    text: >-
      After forty years of faithful service, she finally felt ready to
      retire, though leaving felt far more difficult than she had ever
      imagined. Her colleagues gathered to celebrate her achievements,
      praising her fairness, her vision, and the quiet influence she had on
      everyone who ever worked beside her.
