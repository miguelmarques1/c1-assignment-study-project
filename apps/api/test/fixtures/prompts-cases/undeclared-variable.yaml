id: undeclared-variable
version: "1"
model: gemini-3.6-flash
temperature: 0.5
max_output_tokens: 200
system: You are a helpful test assistant.
user_template: "Say hello to {{name}}, from {{city}}."
variables:
  - name: name
    required: true
response_schema:
  type: object
  properties:
    greeting:
      type: string
  required: [greeting]
