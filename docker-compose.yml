name: english-quest

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-english_quest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-english_quest}
      POSTGRES_DB: ${POSTGRES_DB:-english_quest}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-english_quest} -d ${POSTGRES_DB:-english_quest}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  minio:
    # MinIO is published on quay.io, not Docker Hub — pulling minio/minio fails
    # with "pull access denied" even when authenticated.
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"
      - "${LIVEKIT_TCP_PORT:-7881}:7881"
      # Single muxed UDP port for real WebRTC media, published from F05 onward.
      - "${LIVEKIT_UDP_PORT:-7882}:7882/udp"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7880/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy

  # Per-track audio egress for lesson recording (F07). Dispatches recording
  # requests over the same Redis livekit.yaml now points at.
  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      - egress-tmp:/home/egress/tmp
    ports:
      - "${LIVEKIT_EGRESS_HEALTH_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy

  # Application containers start idle on purpose. Bring the stack up, then start
  # only what a given task needs:
  #   docker compose exec api pnpm dev
  #   docker compose exec web pnpm dev
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    restart: unless-stopped
    command: ["sleep", "infinity"]
    working_dir: /workspace
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-english_quest}:${POSTGRES_PASSWORD:-english_quest}@postgres:5432/${POSTGRES_DB:-english_quest}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      LIVEKIT_URL: http://livekit:7880
      # EGRESS_S3_ENDPOINT is left unset: its fallback (S3_ENDPOINT above) is
      # already the address the egress container can reach on this network.
      LIVEKIT_EGRESS_HEALTH_URL: http://egress:8080
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - .:/workspace
      - root-node-modules:/workspace/node_modules
      - api-node-modules:/workspace/apps/api/node_modules
      - web-node-modules:/workspace/apps/web/node_modules
      - shared-node-modules:/workspace/packages/shared/node_modules
      - design-tokens-node-modules:/workspace/packages/design-tokens/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    restart: unless-stopped
    command: ["sleep", "infinity"]
    working_dir: /workspace
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      API_INTERNAL_URL: http://api:3001
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - .:/workspace
      - root-node-modules:/workspace/node_modules
      - api-node-modules:/workspace/apps/api/node_modules
      - web-node-modules:/workspace/apps/web/node_modules
      - shared-node-modules:/workspace/packages/shared/node_modules
      - design-tokens-node-modules:/workspace/packages/design-tokens/node_modules
    depends_on:
      - api

  # Runs the visual regression suite against the web service. The official
  # Playwright image ships browsers pinned to one exact Playwright version,
  # which must match @playwright/test in apps/web/package.json. Fonts and
  # rendering come from Linux inside the container regardless of the host
  # OS, which is what makes the committed baselines stable for anyone who
  # runs this suite.
  visual:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /workspace/apps/web
    environment:
      VISUAL_BASE_URL: http://web:3000
    volumes:
      - .:/workspace
      - root-node-modules:/workspace/node_modules
      - api-node-modules:/workspace/apps/api/node_modules
      - web-node-modules:/workspace/apps/web/node_modules
      - shared-node-modules:/workspace/packages/shared/node_modules
      - design-tokens-node-modules:/workspace/packages/design-tokens/node_modules
    command: ["sleep", "infinity"]
    depends_on:
      - web

volumes:
  postgres-data:
  redis-data:
  minio-data:
  root-node-modules:
  api-node-modules:
  web-node-modules:
  shared-node-modules:
  design-tokens-node-modules:
  egress-tmp:
